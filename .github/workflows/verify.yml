name: Verify package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python tools/validate.py
      - run: python tools/check_publication.py --refs HEAD
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s skills/business-desk/scripts -v
      - run: python tools/build_release.py
